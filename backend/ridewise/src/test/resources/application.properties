# ============================================================
# RideWise — TEST configuration
#
# WHY THIS FILE EXISTS
#   A file with this name on the test classpath REPLACES
#   src/main/resources/application.properties while tests run.
#   Without it, `mvnw test` connected to the real PostgreSQL database
#   and the tests' deleteAll() calls erased every user, ride and
#   connection in it.
#
#   Tests now run on a throw-away in-memory H2 database, so they can
#   never touch real data. PostgreSQL compatibility mode keeps the
#   native SQL (Near Riders) and the Spring Session schema working
#   unchanged.
#
#   The same file also powers a zero-setup local backend:
#       mvnw.cmd spring-boot:test-run
#   starts the app on port 8080 with an empty in-memory database.
# ============================================================

server.port=8080

# A unique database per Spring context — the MockMvc tests and the
# real-port WebSocket tests never see each other's rows.
spring.datasource.url=jdbc:h2:mem:ridewise-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.task.scheduling.pool.size=2

# Same session behaviour as production (see the main properties file)
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:session-schema.sql

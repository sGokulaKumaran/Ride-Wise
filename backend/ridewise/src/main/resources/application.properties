# ============================================================
# 🚀 RideWise Backend Configuration
#
# DATABASE: PostgreSQL (persistent — data survives restarts)
#
# PREREQUISITES:
#   1. PostgreSQL running on localhost:5432
#   2. Database "ridewise" created:
#      CREATE DATABASE ridewise;
#   3. Update password below to match your PostgreSQL setup
# ============================================================

# Server port
server.port=8080

# ===== POSTGRESQL DATABASE (DEFAULT — persistent) =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ridewise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:goku3813}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings — auto-create/update tables from Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Every timestamp is stored and sent as UTC (see RideWiseApplication and
# JacksonConfig) — the browser converts it to the rider's local time.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Database work happens in the service layer only. Keeping a connection
# open for the whole web request (Spring's default) is not needed here and
# ties up the small connection pool.
spring.jpa.open-in-view=false

# ============================================================
# RIDES
# ------------------------------------------------------------
# A ride that is still "active" this many hours after it was created is
# ended automatically (StaleRideSweeper) — riders who never pressed
# "End ride" would otherwise keep it live forever. 0 switches this off.
# ============================================================
ridewise.rides.auto-end-hours=48

# ============================================================
# FLEET (organization vehicles)
# ------------------------------------------------------------
# A vehicle trip that has sent no position for this many minutes is ended
# automatically (VehicleSessionSweeper) and its vehicle is free again — a
# driver whose phone died must not keep a bus "in use" all day.
# 0 switches this off.
# ============================================================
ridewise.fleet.session-timeout-minutes=30

# Connection pool tuning (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Disable H2 console (not needed with PostgreSQL)
spring.h2.console.enabled=false

# Enable scheduling (for DataCleanupService automatic cleanup)
spring.task.scheduling.pool.size=2

# ============================================================
# SESSION / LOGIN LIFETIME
# ------------------------------------------------------------
# The JSESSIONID cookie is the ONLY thing AuthContext checks with
# GET /api/auth/me when the app starts.
#
# WHY max-age MATTERS (and why "Remember me" failed on phones):
#   Without a Max-Age the cookie is a *session cookie* — it lives in
#   the browser's memory only. Desktop Chrome keeps those cookies
#   alive, but MOBILE CHROME DROPS THEM as soon as the browser is
#   closed. The cookie was already gone before the app could send
#   /api/auth/me, so a fresh login was forced even when the user had
#   ticked "Remember me". A Max-Age makes the cookie persistent, so
#   the memory lives in the browser profile instead.
#
# "Remember me" itself is enforced on the client (AuthContext.jsx):
#   ticked   → localStorage "ridewise-remember-me" = "true"
#              → a fresh browser start restores the session
#   unticked → only sessionStorage marks the tab as logged in, and
#              the browser clears that on close → login page
#
# SameSite=Lax is the explicit form of what browsers already assume
# for a cookie with no SameSite attribute, so nothing changes there.
# `secure` is deliberately NOT set: the Cloudflare Pages function
# proxies /api/* over HTTPS in production, but local Vite dev goes
# through http://localhost — a Secure cookie would be dropped there.
# ============================================================
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d

# ---- Sessions are stored in PostgreSQL, not in Tomcat's memory ----
# Tomcat keeps sessions in heap by default, so every backend restart
# (a Render deploy, or a free-tier spin-down after ~15 idle minutes)
# destroyed them and a "Remember me" user was bounced back to the login
# page even though the browser still held a perfectly good cookie.
# spring-session-jdbc moves the session into the existing PostgreSQL
# database, so the cookie above stays valid across restarts.
#
# initialize-schema=always is required for PostgreSQL (Boot's default,
# "embedded", does nothing for a real database). The script it points at
# uses CREATE TABLE IF NOT EXISTS, so running it on every startup is a
# safe no-op once the tables exist.
#
# The session id cookie keeps working exactly the same; Spring Boot
# applies the server.servlet.session.cookie.* settings above to the
# Spring Session cookie, and spring.session.timeout falls back to
# server.servlet.session.timeout when it is not set explicitly.
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:session-schema.sql

# CORS — allow frontend at localhost:5173 to call this backend
# (configured in WebConfig.java but also set here as backup)

# ============================================================
# FEEDBACK EMAIL FORWARDING (Optional — Gmail SMTP)
# ------------------------------------------------------------
# Admin can set their target Gmail address inside the Admin -> Feedback
# page (or via RIDEWISE_ADMIN_ALERT_EMAIL). When MAIL_USERNAME and
# MAIL_PASSWORD (a 16-character Gmail App Password) are provided, every
# new feedback/bug submission is also emailed directly to that Gmail.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
ridewise.admin.alert-email=${RIDEWISE_ADMIN_ALERT_EMAIL:}
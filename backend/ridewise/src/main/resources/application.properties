# ============================================================
# 🚀 RideWise Backend Configuration
# 
# CURRENT: Uses H2 (in-memory database, no setup needed)
# FUTURE:  Switch to PostgreSQL by:
#          1. Uncomment postgresql in pom.xml
#          2. Comment the h2 datasource block below
#          3. Uncomment the postgresql datasource block
# ============================================================

# Server port
server.port=8080

# ===== H2 DATABASE (CURRENT — for local development) =====
spring.datasource.url=jdbc:h2:mem:ridewise
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA settings — auto-create tables from Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== POSTGRESQL DATABASE (FUTURE — uncomment when ready) =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/ridewise
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CORS — allow frontend at localhost:5173 to call this backend
# (configured in WebConfig.java but also set here as backup)
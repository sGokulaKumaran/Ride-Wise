<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="RideWise — Every journey, connected. Live navigation, group sync, and fleet tracking platform.">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blue-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orange-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card-clip">
      <rect x="0" y="0" width="900" height="300" rx="18"/>
    </clipPath>

    <clipPath id="map-clip">
      <rect x="468" y="22" width="406" height="256" rx="14"/>
    </clipPath>

    <!-- Main route path & off-route purple rejoin arc -->
    <path id="hero-route" d="M 492 238 C 534 236, 558 186, 608 174 C 658 162, 682 110, 738 98 C 786 88, 814 58, 848 52"/>
    <path id="hero-rejoin" d="M 556 96 C 588 94, 616 120, 642 146 C 654 158, 668 144, 692 122"/>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Base obsidian card -->
    <rect x="0" y="0" width="900" height="300" fill="url(#bg-grad)"/>
    <circle cx="140" cy="40" r="190" fill="url(#orange-ambient)"/>

    <!-- Left panel: Identity & Cycling Modes -->
    <g>
      <!-- Live status pill -->
      <rect x="38" y="34" width="246" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="55" cy="47" r="4" fill="#f97316">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="47" r="4" fill="none" stroke="#f97316" stroke-width="1.5">
        <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="69" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#e2e8f0">LIVE · OPEN GEOSPATIAL STACK</text>

      <!-- Brand title -->
      <text x="38" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2" fill="#f8fafc">Ride<tspan fill="#f97316">Wise</tspan></text>
      <rect x="40" y="131" width="92" height="3.5" rx="1.75" fill="url(#accent-bar)"/>

      <!-- Tagline -->
      <text x="38" y="164" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">Every journey, connected.</text>

      <!-- Cycling capability pill -->
      <rect x="38" y="186" width="388" height="36" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
      <circle cx="54" cy="204" r="3.5" fill="#3b82f6"/>

      <text x="68" y="209" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#93c5fd">
        Solo Turn-by-Turn Voice Navigation
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.27;0.33;0.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="209" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c4b5fd" opacity="0">
        Live Group Sync &amp; Purple Rejoin Path
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.61;0.67;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="209" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fdba74" opacity="0">
        Campus Buses, Travels &amp; City Fleet Radar
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.70;0.93;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <!-- Bottom quick spec strip -->
      <text x="38" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">React 19 · Spring Boot 3.4 · /ws/rides &amp; /ws/fleet · 0 Map API Keys</text>
    </g>

    <!-- Right panel: Animated Live Map Canvas -->
    <g clip-path="url(#map-clip)">
      <rect x="468" y="22" width="406" height="256" fill="#070d1a"/>

      <!-- Stylized city street grid -->
      <g stroke="#111c33" stroke-width="1">
        <line x1="468" y1="64" x2="874" y2="64"/>
        <line x1="468" y1="106" x2="874" y2="106"/>
        <line x1="468" y1="148" x2="874" y2="148"/>
        <line x1="468" y1="190" x2="874" y2="190"/>
        <line x1="468" y1="232" x2="874" y2="232"/>
        <line x1="518" y1="22" x2="518" y2="278"/>
        <line x1="578" y1="22" x2="578" y2="278"/>
        <line x1="638" y1="22" x2="638" y2="278"/>
        <line x1="698" y1="22" x2="698" y2="278"/>
        <line x1="758" y1="22" x2="758" y2="278"/>
        <line x1="818" y1="22" x2="818" y2="278"/>
      </g>

      <!-- Secondary arterial roads -->
      <g stroke="#172542" stroke-width="2" fill="none">
        <path d="M 468 178 Q 610 156 874 186"/>
        <path d="M 552 22 Q 594 148 564 278"/>
        <path d="M 744 22 Q 724 160 778 278"/>
      </g>

      <!-- Vertical radar scanline sweep -->
      <rect x="468" y="-48" width="406" height="48" fill="url(#scan-grad)">
        <animate attributeName="y" values="-48;280;280" keyTimes="0;0.75;1" dur="7s" repeatCount="indefinite"/>
      </rect>

      <!-- Main Route (Blue glow + core) -->
      <use href="#hero-route" xlink:href="#hero-route" fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="11" stroke-linecap="round"/>
      <use href="#hero-route" xlink:href="#hero-route" fill="none" stroke="#60a5fa" stroke-width="3.2" stroke-linecap="round"/>

      <!-- Off-route Purple Rejoin Path -->
      <use href="#hero-rejoin" xlink:href="#hero-rejoin" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>
      <use href="#hero-rejoin" xlink:href="#hero-rejoin" fill="none" stroke="#c4b5fd" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>

      <!-- Fleet / Bus Stop Radar Pings (Orange) -->
      <g>
        <circle cx="546" cy="204" r="4" fill="#f97316"/>
        <circle cx="546" cy="204" r="4" fill="none" stroke="#f97316" stroke-width="1.5">
          <animate attributeName="r" values="4;19" dur="2.6s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
        </circle>

        <circle cx="692" cy="122" r="4" fill="#f97316"/>
        <circle cx="692" cy="122" r="4" fill="none" stroke="#f97316" stroke-width="1.5">
          <animate attributeName="r" values="4;19" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
        </circle>

        <circle cx="816" cy="64" r="4" fill="#f97316"/>
        <circle cx="816" cy="64" r="4" fill="none" stroke="#f97316" stroke-width="1.5">
          <animate attributeName="r" values="4;19" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Moving Purple Rejoin Rider -->
      <g>
        <circle cx="0" cy="0" r="11" fill="url(#purple-halo)"/>
        <circle cx="0" cy="0" r="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
        <animateMotion dur="5.5s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1" keyPoints="0;1" keyTimes="0;1">
          <mpath href="#hero-rejoin" xlink:href="#hero-rejoin"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5.5s" begin="-1.2s" repeatCount="indefinite"/>
      </g>

      <!-- Moving Main Route Puck -->
      <g>
        <circle cx="0" cy="0" r="14" fill="url(#blue-halo)"/>
        <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <animateMotion dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1" keyPoints="0;1" keyTimes="0;1">
          <mpath href="#hero-route" xlink:href="#hero-route"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite"/>
      </g>

      <!-- Map HUD overlay chip -->
      <rect x="482" y="34" width="164" height="24" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1"/>
      <circle cx="496" cy="46" r="3" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="506" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#cbd5e1">ACTIVE TELEMETRY · 25s</text>
    </g>

    <!-- Map frame border -->
    <rect x="468" y="22" width="406" height="256" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Periodic diagonal sheen sweep across banner -->
    <rect x="-180" y="0" width="140" height="300" fill="url(#sheen-grad)" transform="skewX(-18)">
      <animate attributeName="x" values="-180;1050;1050" keyTimes="0;0.24;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer card border -->
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
